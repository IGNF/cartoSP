<div class="fr-container">
    <div class="fr-grid-row margin-content">
        <nav role="navigation" class="fr-breadcrumb fr-col-12" aria-label="Navigation secondaire">
            <button type="button" class="fr-breadcrumb__button" aria-expanded="false" aria-controls="breadcrumb">Voir le fil d&#39;arianne</button>
            <div class="fr-collapse" id="breadcrumb">
              <ol class="fr-breadcrumb__list">
                <li>
                  <a class="fr-breadcrumb__link" id="segment-0" aria-label="Retour à la page d'accueil" href="/">Accueil</a>
                </li>
                <li>
                  <a class="fr-breadcrumb__link" id="segment-1" aria-current="page">Note de versions</a>
                </li>
              </ol>
            </div>
        </nav>
        <div class="dsfr-container">
          <div>
            <h1 class="fr-h1">Note de versions</h1>
            <p class="fr-text--lead">
              <strong>Description des évolutions du site</strong>
            </p>

            @if (releases$ | async; as releases) {
              @for (release of releases; track release.tag_name; let i = $index) {
                <section class="fr-accordion">
                  <h3 class="fr-accordion__title">
                    <button type="button" class="fr-accordion__btn" aria-expanded="false" [attr.aria-controls]="'accordion-' + i">
                      <span class="release-title">
                        <span>Version <b>{{ release.tag_name }}</b></span>
                        <span class=""release-date>{{ release.published_at | date:'dd/MM/yyyy'}}</span>
                      </span>
                    </button>
                  </h3>
                  <div [id]="'accordion-' + i" class="fr-collapse">
                    <markdown class="release-body" [data]="release.body || 'Aucune description disponible.'"></markdown>
                  </div>
                </section>
              } @empty {
                <p>Aucune version disponible pour le moment.</p>
              }
            } @else {
              <p>Chargement des versions…</p>
            }
          </div>
        </div>

    </div>
</div>
